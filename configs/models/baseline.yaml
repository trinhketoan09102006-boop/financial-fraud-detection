
version: 1

experiment:
  name: baseline_v1
  feature_set: baseline_v1
  seed: 42
  dataset: sparkov
  evaluation_split: validation
  sampling_strategy: none

models:
  lr:
    max_iter: 1000
    random_state: 42

  rf:
    n_estimators: 100
    min_samples_leaf: 2
    n_jobs: -1
    random_state: 42

  lgbm:
    n_estimators: 100
    learning_rate: 0.05
    num_leaves: 15
    n_jobs: 4
    random_state: 42
    verbosity: -1

metrics:
  primary: average_precision
  secondary:
    - precision
    - recall
    - f1
    - fpr

artifacts:
  directory: artifacts/models
  save_preprocessor: true
  save_predictions: true
